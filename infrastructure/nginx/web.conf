server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # See security-headers.conf for why this is an include rather than a list of
    # `add_header` directives here: any location that sets its own header would
    # otherwise silently drop all of them.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Container healthcheck target — must not fall through to index.html.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html itself must never be cached, or a deploy leaves clients
    # requesting asset hashes that no longer exist.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Client-side routing: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
