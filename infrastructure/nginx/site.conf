server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # See security-headers.conf for why this is an include rather than a list of
    # `add_header` directives here: any location that sets its own header would
    # otherwise silently drop all of them.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # The export's own not-found page, with a real 404 status so crawlers do not
    # index it. The internal redirect lands in `location /`, so the page takes
    # that location's headers, not the long cache of the location that missed.
    error_page 404 /404.html;

    # Container healthcheck target — must not depend on the export's contents.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Next emits content-hashed filenames here, so these can be cached
    # indefinitely.
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # The clip posters. Their names are not content-hashed, so a poster that
    # `pnpm assets` re-renders must be given a new name, or returning visitors
    # keep the old one until this expires.
    location /media/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Pages, plus everything else whose name stays the same across deploys: the
    # share card, icons, robots.txt, the sitemap and the RSC payloads (*.txt)
    # that client-side navigation fetches. `no-cache` still lets the browser
    # keep them, but it revalidates first (a cheap 304), so a deploy shows at
    # once and never pairs old HTML with chunk hashes that no longer exist.
    #
    # `trailingSlash: true` exports each page as <path>/index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }
}
