# Security headers, kept in an include on purpose.
# Installed at /etc/nginx/snippets/ — never conf.d/, which nginx auto-loads.
#
# nginx does NOT merge `add_header` down a block: a location that declares any
# `add_header` of its own discards every header inherited from the server block.
# Both `/assets/` and `= /index.html` set Cache-Control, so without re-including
# these they would serve the app with no security headers at all.
#
# `always` makes them apply to error responses too.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
