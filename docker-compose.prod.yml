# =============================================================================
# CoreTask — production overlay
# =============================================================================
#   pnpm prod:build   (docker compose -f docker-compose.yml -f docker-compose.prod.yml build)
#   pnpm prod:up
#
# This is a production-*shaped* stack, not a deployment manifest: multi-stage
# images, no source mounts, no dev tooling, non-root users, resource limits and
# restart policies. A real deployment supplies the same environment from a
# secret store and puts its own ingress and TLS in front of `coretask-webapp`.
# =============================================================================

services:
  coretask-postgres:
    # Not published by default — the database is reachable only on the compose
    # network. Uncomment to attach a client from the host.
    # ports:
    #   - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  coretask-redis:
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  # Production files live in Cloudflare R2, so the bundled RustFS and its bucket
  # job start only when asked for: `--profile local-storage`, with
  # STORAGE_ENDPOINT=http://coretask-storage:9000, for a stack that keeps its
  # files on this machine instead.
  coretask-storage:
    profiles: [local-storage]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  coretask-storage-init:
    profiles: [local-storage]

  coretask-api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: runtime
    image: coretask/api:${IMAGE_TAG:-latest}
    environment: &production-env
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # R2's S3 API (see "Object storage" in .env.example). The base file pins
      # the compose-network RustFS; here the address is the operator's to give.
      # The browser fetches presigned URLs from the same host, so the public
      # endpoint stays empty.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT is required — the R2 S3 API address}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required — an R2 API token}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required — an R2 API token}
    command: ["node", "dist/main.js"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  coretask-worker:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: runtime
    image: coretask/api:${IMAGE_TAG:-latest}
    # The sweeper and workspace deletion remove files, so the worker needs the
    # same bucket as the API.
    environment: *production-env
    command: ["node", "dist/worker.js"]
    # A queue consumer has no HTTP surface; liveness is "the process is up".
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  coretask-webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
      target: runtime
      args:
        # Baked into the bundle at build time — rebuild the image to change it.
        # Defaults suit a local run; for app.coretask.org set both to
        # api.coretask.org (see "Production domains" in .env.example).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:3000}
        VITE_APP_NAME: ${VITE_APP_NAME:-CoreTask}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-support@coretask.org}
    image: coretask/webapp:${IMAGE_TAG:-latest}
    depends_on:
      coretask-api:
        condition: service_healthy
    ports:
      # The unprivileged nginx image listens on 8080 inside the container.
      - "${WEB_HTTP_PORT:-8080}:8080"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # The static export behind nginx; the dev overlay runs `next dev` instead.
  coretask-website:
    build:
      context: .
      dockerfile: website/Dockerfile
      target: runtime
      args:
        # Baked into the HTML at build time — rebuild the image to change them.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://coretask.org}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.coretask.org}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-hello@coretask.org}
    image: coretask/website:${IMAGE_TAG:-latest}
    ports:
      - "${WEBSITE_HTTP_PORT:-8081}:8080"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
