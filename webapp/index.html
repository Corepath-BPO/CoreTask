<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CoreTask — project management and ticketing for modern teams."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The mark alone, never the lockup: the wordmark is unreadable at 32px.
         The .ico carries the 16/32/48 raster sizes older browsers ask for; the
         SVG is preferred where supported. Both draw the mark on its own dark
         tile, so it reads on light and dark browser chrome alike. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Matches --background; the script below re-points it at the resolved
         theme, since a stored choice can disagree with the OS preference. -->
    <meta name="theme-color" content="#F9F9FA" />
    <title>CoreTask</title>
    <script>
      // Applies the stored theme before first paint so a dark-mode reload never
      // flashes a white screen.
      (function () {
        try {
          var stored = localStorage.getItem('coretask.theme');
          var theme =
            stored && stored !== 'system'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#08080B' : '#F9F9FA');
        } catch (_) {
          /* private mode — fall through to the light theme */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
