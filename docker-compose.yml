# =============================================================================
# CoreTask — base stack
# =============================================================================
# Never used on its own. Combine with an overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml  up
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file holds what both environments share: service names, networking,
# health checks and persistent volumes. Build definitions, port publishing and
# mounts live in the overlays.
# =============================================================================

name: coretask

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — primary datastore
  # ---------------------------------------------------------------------------
  coretask-postgres:
    image: postgres:17-alpine
    container_name: coretask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coretask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coretask_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-coretask}
      # Speeds up index creation on first boot; irrelevant afterwards.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - coretask-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `-d`/`-U` matter: without them pg_isready reports ready before the
      # application database exists, and the API starts against nothing.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coretask} -d ${POSTGRES_DB:-coretask}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [coretask]

  # ---------------------------------------------------------------------------
  # Redis — cache, BullMQ queues, Socket.IO adapter
  # ---------------------------------------------------------------------------
  coretask-redis:
    image: redis:7-alpine
    container_name: coretask-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - coretask-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [coretask]

  # ---------------------------------------------------------------------------
  # RustFS — S3-compatible object storage for attachments
  # ---------------------------------------------------------------------------
  # MinIO held this slot until its community edition was archived upstream and
  # its images disappeared from Docker Hub, which left every fresh machine and
  # every CI runner unable to start storage at all. RustFS has the same shape:
  # one container, the S3 API on 9000, a console on 9001.
  #
  # Pinned rather than `latest`. On a storage server, a floating tag is how the
  # on-disk format changes underneath a volume without anyone deciding it.
  #
  # The region is set to whatever the API signs with: SigV4 covers the region,
  # so a mismatch reads as a bad signature rather than a configuration error.
  coretask-storage:
    image: rustfs/rustfs:1.0.3
    container_name: coretask-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-coretask_minio}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-coretask_minio_dev_password}
      RUSTFS_REGION: ${STORAGE_REGION:-us-east-1}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - coretask-storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [coretask]

  # Short-lived: creates the bucket, then exits 0. `docker compose ps` showing
  # it as "exited" is the success state.
  #
  # The AWS CLI rather than the storage vendor's own client, so this job does
  # not have to change the next time the server behind it does. Path-style
  # addressing is set explicitly: virtual-host style would ask for a hostname
  # of `<bucket>.coretask-storage`, which exists nowhere.
  #
  # The CORS rule lets the web app's origin(s) PUT and GET objects directly:
  # attachments and profile pictures go from the browser straight to storage
  # on a presigned URL, and without the rule the browser refuses the preflight.
  coretask-storage-init:
    image: amazon/aws-cli:2.38.1
    container_name: coretask-storage-init
    restart: "no"
    depends_on:
      coretask-storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-coretask_minio}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-coretask_minio_dev_password}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://coretask-storage:9000
      CORS_ORIGINS: ${WEB_URL:-http://localhost:5173}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws configure set default.s3.addressing_style path &&
        { aws s3api head-bucket --bucket "${STORAGE_BUCKET:-coretask}" 2>/dev/null ||
          aws s3api create-bucket --bucket "${STORAGE_BUCKET:-coretask}"; } &&
        origins=$$(printf '%s' "$$CORS_ORIGINS" | sed 's/[[:space:]]//g; s/,/","/g') &&
        aws s3api put-bucket-cors --bucket "${STORAGE_BUCKET:-coretask}" --cors-configuration \
          '{"CORSRules":[{"AllowedOrigins":["'"$$origins"'"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3000}]}' &&
        echo "bucket ${STORAGE_BUCKET:-coretask} ready"
    networks: [coretask]

  # ---------------------------------------------------------------------------
  # API — REST + WebSocket
  # ---------------------------------------------------------------------------
  coretask-api:
    image: coretask/api:local
    container_name: coretask-api
    restart: unless-stopped
    depends_on:
      coretask-postgres:
        condition: service_healthy
      coretask-redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      API_PORT: 3000
      API_URL: ${API_URL:-http://localhost:3000}
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      # Service names, not localhost — these resolve on the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-coretask}:${POSTGRES_PASSWORD:-coretask_dev_password}@coretask-postgres:5432/${POSTGRES_DB:-coretask}?schema=public
      REDIS_HOST: coretask-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required — copy .env.example to .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required — copy .env.example to .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      STORAGE_ENDPOINT: http://coretask-storage:9000
      # Where a *browser* reaches storage. The value above is a compose-network
      # hostname that no client can resolve, and a presigned URL is signed for
      # the host it will be fetched from, so the two cannot be the same here.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-coretask}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-coretask_minio}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-coretask_minio_dev_password}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_MAX_FILE_SIZE_MB: ${STORAGE_MAX_FILE_SIZE_MB:-25}
      # No defaults for the credentials: an empty value selects the log
      # transport, which is the right outcome for anyone who has not set them.
      MICROSOFT_GRAPH_TENANT_ID: ${MICROSOFT_GRAPH_TENANT_ID:-}
      MICROSOFT_GRAPH_CLIENT_ID: ${MICROSOFT_GRAPH_CLIENT_ID:-}
      MICROSOFT_GRAPH_CLIENT_SECRET: ${MICROSOFT_GRAPH_CLIENT_SECRET:-}
      MICROSOFT_GRAPH_BASE_URL: "${MICROSOFT_GRAPH_BASE_URL:-https://graph.microsoft.com/v1.0}"
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CoreTask}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_CONNECTION_TIMEOUT_MS: ${MAIL_CONNECTION_TIMEOUT_MS:-15000}
      # Email to a project: both or neither. Empty leaves the addresses unshown.
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-}
      INBOUND_EMAIL_SECRET: ${INBOUND_EMAIL_SECRET:-}
      # The AI steps in rules and the CoreTask Slack app: empty leaves each
      # greyed out with a reason.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      ASANA_ACCESS_TOKEN: ${ASANA_ACCESS_TOKEN:-}
      ASANA_WORKSPACE_ID: ${ASANA_WORKSPACE_ID:-}
    networks: [coretask]

  # ---------------------------------------------------------------------------
  # Worker — BullMQ consumer, same codebase, different entrypoint
  # ---------------------------------------------------------------------------
  coretask-worker:
    image: coretask/api:local
    container_name: coretask-worker
    restart: unless-stopped
    depends_on:
      coretask-postgres:
        condition: service_healthy
      coretask-redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      API_URL: ${API_URL:-http://localhost:3000}
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-coretask}:${POSTGRES_PASSWORD:-coretask_dev_password}@coretask-postgres:5432/${POSTGRES_DB:-coretask}?schema=public
      REDIS_HOST: coretask-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      STORAGE_ENDPOINT: http://coretask-storage:9000
      # Where a *browser* reaches storage. The value above is a compose-network
      # hostname that no client can resolve, and a presigned URL is signed for
      # the host it will be fetched from, so the two cannot be the same here.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-coretask}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-coretask_minio}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-coretask_minio_dev_password}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_MAX_FILE_SIZE_MB: ${STORAGE_MAX_FILE_SIZE_MB:-25}
      # The worker is what actually drains the e-mail queue, so these matter
      # more here than on the API — without them invitations are only logged.
      MICROSOFT_GRAPH_TENANT_ID: ${MICROSOFT_GRAPH_TENANT_ID:-}
      MICROSOFT_GRAPH_CLIENT_ID: ${MICROSOFT_GRAPH_CLIENT_ID:-}
      MICROSOFT_GRAPH_CLIENT_SECRET: ${MICROSOFT_GRAPH_CLIENT_SECRET:-}
      MICROSOFT_GRAPH_BASE_URL: "${MICROSOFT_GRAPH_BASE_URL:-https://graph.microsoft.com/v1.0}"
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CoreTask}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_CONNECTION_TIMEOUT_MS: ${MAIL_CONNECTION_TIMEOUT_MS:-15000}
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-}
      INBOUND_EMAIL_SECRET: ${INBOUND_EMAIL_SECRET:-}
      # The AI steps in rules and the CoreTask Slack app: empty leaves each
      # greyed out with a reason.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      ASANA_ACCESS_TOKEN: ${ASANA_ACCESS_TOKEN:-}
      ASANA_WORKSPACE_ID: ${ASANA_WORKSPACE_ID:-}
      # Live sync's pace and its nightly full Sync again (cron, in that zone).
      ASANA_LIVE_SYNC_INTERVAL_MS: ${ASANA_LIVE_SYNC_INTERVAL_MS:-30000}
      ASANA_LIVE_DEFINITIONS_INTERVAL_MS: ${ASANA_LIVE_DEFINITIONS_INTERVAL_MS:-300000}
      ASANA_FULL_SYNC_CRON: ${ASANA_FULL_SYNC_CRON:-0 3 * * *}
      ASANA_FULL_SYNC_TZ: ${ASANA_FULL_SYNC_TZ:-America/Chicago}
      # Migrations are the API container's job; two processes racing
      # `migrate deploy` on start would deadlock on the advisory lock.
      RUN_MIGRATIONS: "false"
    networks: [coretask]

  # ---------------------------------------------------------------------------
  # Web client
  # ---------------------------------------------------------------------------
  coretask-webapp:
    image: coretask/webapp:local
    container_name: coretask-webapp
    restart: unless-stopped
    depends_on:
      - coretask-api
    networks: [coretask]

  # ---------------------------------------------------------------------------
  # Marketing website — coretask.org. Static, so it talks to nothing and
  # nothing waits on it.
  # ---------------------------------------------------------------------------
  coretask-website:
    image: coretask/website:local
    container_name: coretask-website
    restart: unless-stopped
    networks: [coretask]

networks:
  coretask:
    name: coretask
    driver: bridge

volumes:
  coretask-postgres-data:
    name: coretask-postgres-data
  coretask-redis-data:
    name: coretask-redis-data
  coretask-storage-data:
    name: coretask-storage-data
